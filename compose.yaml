services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: pipeline
      # Identifiant de démonstration pour la base locale du projet.
      POSTGRES_PASSWORD: pipeline_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
