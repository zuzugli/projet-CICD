services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    environment:
      AWS_ACCESS_KEY_ID: pipeline
      AWS_SECRET_ACCESS_KEY: pipeline_s3_local
      S3_BUCKET: transactions-csv
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data

  ollama:
    image: ollama/ollama:0.40.16
    profiles: [niveau3]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

volumes:
  postgres_data:
  seaweedfs_data:
  ollama_data:
