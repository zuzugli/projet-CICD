name: CI/CD - Tests et livraison Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: transactions_test
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d transactions_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      seaweedfs:
        image: chrislusf/seaweedfs:4.53
        env:
          AWS_ACCESS_KEY_ID: pipeline
          AWS_SECRET_ACCESS_KEY: pipeline_s3_local
          S3_BUCKET: transactions-csv
        ports:
          - 8333:8333

      ollama:
        image: ollama/ollama:0.40.16
        env:
          OLLAMA_NUM_PARALLEL: "1"
          OLLAMA_MAX_LOADED_MODELS: "1"
        ports:
          - 11434:11434

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Installer le moteur OCR réel
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra fonts-dejavu-core

      - name: Préparer le petit modèle local réel
        run: |
          python -c "from src.slm import attendre_ollama; attendre_ollama()"
          docker exec "${{ job.services.ollama.id }}" ollama pull qwen2.5:0.5b

      - name: Attendre le stockage S3
        run: |
          python - <<'PY'
          from src.pipeline import attendre_s3
          from src.s3_storage import creer_client_s3

          attendre_s3(creer_client_s3())
          print("Le bucket S3 est accessible.")
          PY

      - name: Créer les tables de test
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.database import connecter

          script_sql = Path("sql/create_tables.sql").read_text(
              encoding="utf-8"
          )

          with connecter("transactions_test") as connexion:
              connexion.execute(script_sql)
          PY

      - name: Exécuter tous les tests
        run: python -m pytest tests -v

  livraison:
    name: Livrer l'image Docker
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code testé
        uses: actions/checkout@v7

      - name: Définir le nom et les versions de l'image
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Construire l'image et vérifier son démarrage
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" .
          docker run --rm --network none "${IMAGE}:${VERSION}" python -m src.demo --help

      - name: Se connecter au registre GitHub
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publier la version validée
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          echo "### Image Docker livrée" >> "$GITHUB_STEP_SUMMARY"
          echo "Version : ${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Dernière livraison : ${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
