name: CI - Tests pipeline data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: transactions_test
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d transactions_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Créer les tables de test
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.database import connecter

          script_sql = Path("sql/create_tables.sql").read_text(
              encoding="utf-8"
          )

          with connecter("transactions_test") as connexion:
              connexion.execute(script_sql)
          PY

      - name: Exécuter tous les tests
        run: python -m pytest tests -v